<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Admin | Contact Messages</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #080d18;
      color: #ffffff;
      padding: 30px;
    }

    .admin-container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .header h1 {
      font-size: 30px;
      color: #ffffff;
    }

    .header p {
      color: #94a3b8;
      margin-top: 8px;
    }

    #refreshMessages {
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      cursor: pointer;
      font-size: 15px;
      font-weight: 600;
      color: #0b1020;
      background: linear-gradient(
        90deg,
        #42c8d8,
        #6f5ce7
      );
    }

    #refreshMessages:hover {
      opacity: 0.9;
    }

    #loadingText {
      color: #94a3b8;
      margin-bottom: 20px;
      font-size: 15px;
    }

    #messagesContainer {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(320px, 1fr)
      );
      gap: 20px;
    }

    .message-card {
      background: #111827;
      border: 1px solid #26344f;
      border-radius: 16px;
      padding: 22px;
      transition: 0.2s ease;
    }

    .message-card:hover {
      transform: translateY(-3px);
      border-color: #5d6ddc;
    }

    .message-card h2 {
      font-size: 20px;
      margin-bottom: 20px;
      color: #ffffff;
    }

    .info-row {
      margin-bottom: 13px;
    }

    .label {
      display: block;
      color: #42c8d8;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    .value {
      color: #cbd5e1;
      line-height: 1.5;
      word-break: break-word;
    }

    .message-box {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid #26344f;
    }

    .date {
      display: block;
      margin-top: 20px;
      color: #64748b;
      font-size: 12px;
    }

    .empty-message {
      grid-column: 1 / -1;
      text-align: center;
      padding: 50px 20px;
      background: #111827;
      border: 1px solid #26344f;
      border-radius: 16px;
      color: #94a3b8;
    }

    .error-message {
      grid-column: 1 / -1;
      text-align: center;
      padding: 30px;
      background: #2a1218;
      border: 1px solid #7f1d1d;
      border-radius: 16px;
      color: #fca5a5;
    }

    @media (max-width: 600px) {
      body {
        padding: 20px;
      }

      .header h1 {
        font-size: 24px;
      }

      #messagesContainer {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <div class="admin-container">

    <div class="header">

      <div>
        <h1>Contact Messages</h1>

        <p>
          Messages submitted through your portfolio contact form.
        </p>
      </div>

      <button id="refreshMessages">
        Refresh Messages ↻
      </button>

    </div>

    <p id="loadingText">
      Loading messages...
    </p>

    <div id="messagesContainer"></div>

  </div>


  <script>

    const messagesContainer =
      document.getElementById(
        "messagesContainer"
      );

    const loadingText =
      document.getElementById(
        "loadingText"
      );

    const refreshMessages =
      document.getElementById(
        "refreshMessages"
      );


    function escapeHtml(value) {

      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    async function loadMessages() {

      loadingText.textContent =
        "Loading messages...";

      messagesContainer.innerHTML = "";

      refreshMessages.disabled = true;

      refreshMessages.textContent =
        "Loading...";


      try {

        /*
          IMPORTANT:
          Agar admin.html isi Vercel project ke andar hai,
          to /api/contact automatically correct API ko call karega.
        */

        const response =
          await fetch("/api/contact", {
            method: "GET",
            headers: {
              "Accept": "application/json"
            }
          });


        /*
          Pehle text read kar rahe hain.
          Is se HTML response aane par
          "Unexpected token '<'" error nahi aayega.
        */

        const responseText =
          await response.text();


        let result;


        try {

          result =
            JSON.parse(responseText);

        } catch (jsonError) {

          console.error(
            "API returned non-JSON:",
            responseText
          );

          throw new Error(
            `API returned HTML instead of JSON. ` +
            `Status: ${response.status}. ` +
            `Make sure api/contact.js exists in your Vercel project.`
          );

        }


        if (
          !response.ok ||
          !result.success
        ) {

          throw new Error(
            result.error ||
            "Could not load messages."
          );

        }


        const messages =
          result.submissions || [];


        if (messages.length === 0) {

          loadingText.textContent = "";

          messagesContainer.innerHTML = `
            <div class="empty-message">
              No contact messages found yet.
            </div>
          `;

          return;

        }


        loadingText.textContent =
          `${messages.length} message(s) found`;


        messages.forEach(
          (message) => {

            const card =
              document.createElement("div");

            card.className =
              "message-card";


            let formattedDate =
              "Date unavailable";


            if (message.submitted_at) {

              const date =
                new Date(
                  message.submitted_at
                );

              if (!Number.isNaN(date.getTime())) {

                formattedDate =
                  date.toLocaleString();

              }

            }


            card.innerHTML = `

              <h2>
                ${escapeHtml(
                  message.name || "Unknown"
                )}
              </h2>


              <div class="info-row">

                <span class="label">
                  Email
                </span>

                <div class="value">
                  ${escapeHtml(
                    message.email || "Not provided"
                  )}
                </div>

              </div>


              <div class="info-row">

                <span class="label">
                  Phone
                </span>

                <div class="value">
                  ${escapeHtml(
                    message.phone || "Not provided"
                  )}
                </div>

              </div>


              <div class="info-row">

                <span class="label">
                  Subject
                </span>

                <div class="value">
                  ${escapeHtml(
                    message.subject || "No subject"
                  )}
                </div>

              </div>


              <div class="message-box">

                <span class="label">
                  Message
                </span>

                <div class="value">
                  ${escapeHtml(
                    message.message || "No message"
                  )}
                </div>

              </div>


              <small class="date">
                Received: ${escapeHtml(
                  formattedDate
                )}
              </small>

            `;


            messagesContainer.appendChild(
              card
            );

          }
        );


      } catch (error) {

        console.error(
          "Load messages error:",
          error
        );


        loadingText.textContent = "";


        messagesContainer.innerHTML = `

          <div class="error-message">

            <strong>
              Could not load messages.
            </strong>

            <br><br>

            ${escapeHtml(
              error.message
            )}

          </div>

        `;


      } finally {

        refreshMessages.disabled = false;

        refreshMessages.textContent =
          "Refresh Messages ↻";

      }

    }


    refreshMessages.addEventListener(
      "click",
      loadMessages
    );


    loadMessages();

  </script>

</body>
</html>
