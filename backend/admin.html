<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Submissions — Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --void:#060810;
  --surface:#0b1122;
  --surface-2:#101a30;
  --surface-3:#141f3a;
  --border:rgba(154,178,255,0.12);
  --border-strong:rgba(154,178,255,0.22);
  --blue:#4d7fff;
  --violet:#8b6bff;
  --cyan:#2fd9e8;
  --text:#eef1fb;
  --muted:#8f97b3;
  --muted-2:#5c6479;
  --grad: linear-gradient(120deg, var(--cyan), var(--blue) 55%, var(--violet));
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',sans-serif;
  --font-mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{
  background:var(--void);color:var(--text);font-family:var(--font-body);
  min-height:100vh;padding:48px 24px 80px;
}
body::before{
  content:'';position:fixed;inset:0;z-index:0;
  background:radial-gradient(ellipse 60% 45% at 15% -10%, rgba(139,107,255,0.14), transparent 60%),
             radial-gradient(ellipse 55% 40% at 100% 10%, rgba(47,217,232,0.09), transparent 60%);
  pointer-events:none;
}
.wrap{max-width:960px;margin:0 auto;position:relative;z-index:1;}
header{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:36px;flex-wrap:wrap;}
.eyebrow{
  font-family:var(--font-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--cyan);display:inline-flex;align-items:center;gap:9px;margin-bottom:10px;
}
.eyebrow::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 10px var(--cyan);}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(24px,3.4vw,34px);letter-spacing:-.01em;}
.count-pill{
  font-family:var(--font-mono);font-size:12.5px;color:var(--muted);
  border:1px solid var(--border-strong);border-radius:999px;padding:8px 16px;
  display:flex;align-items:center;gap:8px;background:rgba(255,255,255,0.02);
}
.count-pill b{color:var(--cyan);font-size:14px;}
.refresh-btn{
  font-family:var(--font-mono);font-size:12.5px;color:var(--void);
  background:var(--grad);border:none;border-radius:999px;padding:9px 18px;cursor:pointer;
  font-weight:600;transition:transform .3s;
}
.refresh-btn:hover{transform:translateY(-1px);}

.list{display:flex;flex-direction:column;gap:16px;}
.card{
  background:linear-gradient(160deg, var(--surface-2), var(--surface));
  border:1px solid var(--border);border-radius:16px;padding:24px 26px;
  transition:border-color .3s, transform .3s;
}
.card:hover{border-color:var(--border-strong);transform:translateY(-2px);}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:14px;flex-wrap:wrap;}
.name{font-family:var(--font-display);font-weight:600;font-size:17px;}
.timestamp{font-family:var(--font-mono);font-size:11.5px;color:var(--muted-2);white-space:nowrap;}
.meta-row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px;}
.meta-chip{
  font-family:var(--font-mono);font-size:12px;color:var(--muted);
  background:rgba(255,255,255,0.03);border:1px solid var(--border);border-radius:8px;padding:6px 12px;
  display:flex;align-items:center;gap:7px;
}
.meta-chip .k{color:var(--cyan);}
.subject{font-size:13px;color:var(--muted);margin-bottom:8px;font-style:italic;}
.message{font-size:14.5px;line-height:1.6;color:var(--text);white-space:pre-wrap;word-break:break-word;}

.empty{
  text-align:center;padding:90px 20px;border:1px dashed var(--border-strong);border-radius:16px;
  color:var(--muted);
}
.empty .glyph{font-size:32px;margin-bottom:14px;color:var(--muted-2);}
.empty h3{font-family:var(--font-display);color:var(--text);font-size:18px;margin-bottom:8px;}
.empty p{font-size:13.5px;max-width:340px;margin:0 auto;}

.loading, .error{
  text-align:center;padding:60px 20px;color:var(--muted);font-family:var(--font-mono);font-size:13px;
}
.error{color:#ff8080;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="eyebrow">Admin</div>
      <h1>Contact Submissions</h1>
    </div>
    <div style="display:flex;gap:12px;align-items:center;">
      <span class="count-pill" id="countPill">— entries</span>
      <button class="refresh-btn" id="refreshBtn">↻ Refresh</button>
    </div>
  </header>

  <div id="content" class="loading">Loading submissions…</div>
</div>

<script>
// Point this at your backend's contact API.
const API_URL = (location.origin && location.origin.startsWith('http') && location.port !== '5000')
  ? `${location.origin.replace(/:\d+$/, '')}:5000/api/contact`
  : 'http://localhost:5000/api/contact';

const content = document.getElementById('content');
const countPill = document.getElementById('countPill');
const refreshBtn = document.getElementById('refreshBtn');

function escapeHtml(str){
  return String(str ?? '').replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function formatDate(iso){
  try{
    const d = new Date(iso);
    return d.toLocaleString(undefined, { year:'numeric', month:'short', day:'numeric', hour:'2-digit', minute:'2-digit' });
  }catch{ return iso; }
}

async function loadSubmissions(){
  content.className = 'loading';
  content.textContent = 'Loading submissions…';
  try{
    const res = await fetch(API_URL);
    const data = await res.json();
    if(!data.success) throw new Error(data.error || 'Failed to load submissions');

    const subs = (data.submissions || []).slice().sort((a,b)=> new Date(b.submittedAt) - new Date(a.submittedAt));
    countPill.innerHTML = `<b>${subs.length}</b> ${subs.length === 1 ? 'entry' : 'entries'}`;

    if(subs.length === 0){
      content.className = '';
      content.innerHTML = `
        <div class="empty">
          <div class="glyph">◎</div>
          <h3>No submissions yet</h3>
          <p>When someone fills out the contact form, their message will show up here.</p>
        </div>`;
      return;
    }

    content.className = 'list';
    content.innerHTML = subs.map(s => `
      <div class="card">
        <div class="card-top">
          <div class="name">${escapeHtml(s.name)}</div>
          <div class="timestamp">${formatDate(s.submittedAt)}</div>
        </div>
        <div class="meta-row">
          <span class="meta-chip"><span class="k">✉</span>${escapeHtml(s.email)}</span>
          <span class="meta-chip"><span class="k">☎</span>${escapeHtml(s.phone)}</span>
        </div>
        ${s.subject ? `<div class="subject">"${escapeHtml(s.subject)}"</div>` : ''}
        <div class="message">${escapeHtml(s.message)}</div>
      </div>
    `).join('');
  }catch(err){
    content.className = 'error';
    content.textContent = err.message.includes('fetch')
      ? 'Could not reach the server. Is the backend running on port 5000?'
      : err.message;
  }
}

refreshBtn.addEventListener('click', loadSubmissions);
loadSubmissions();
</script>
</body>
</html>
