<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Admin Dashboard | Contact Messages</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 30px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 28px;
    }

    .subtitle {
      color: #94a3b8;
      margin-top: 8px;
    }

    button {
      border: none;
      cursor: pointer;
      padding: 12px 18px;
      border-radius: 8px;
      font-size: 15px;
      font-weight: bold;
      background: #2563eb;
      color: white;
    }

    button:hover {
      opacity: 0.9;
    }

    .status {
      margin-bottom: 20px;
      padding: 15px;
      border-radius: 8px;
      display: none;
    }

    .loading {
      background: #1e3a5f;
      color: #93c5fd;
    }

    .error {
      background: #450a0a;
      color: #fca5a5;
    }

    .success {
      background: #052e16;
      color: #86efac;
    }

    .messages-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
      gap: 20px;
    }

    .message-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 22px;
    }

    .message-card h2 {
      color: #60a5fa;
      margin-bottom: 15px;
      font-size: 20px;
    }

    .row {
      margin-bottom: 12px;
    }

    .label {
      display: block;
      color: #94a3b8;
      font-size: 13px;
      margin-bottom: 4px;
    }

    .value {
      color: #f8fafc;
      word-break: break-word;
      line-height: 1.5;
    }

    .message-box {
      margin-top: 10px;
      background: #0f172a;
      padding: 12px;
      border-radius: 8px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    .empty {
      grid-column: 1 / -1;
      text-align: center;
      padding: 50px 20px;
      background: #1e293b;
      border-radius: 12px;
      color: #94a3b8;
    }

    @media (max-width: 600px) {
      body {
        padding: 15px;
      }

      h1 {
        font-size: 23px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="header">
      <div>
        <h1>📩 Contact Messages</h1>
        <p class="subtitle">Messages received from your portfolio contact form</p>
      </div>

      <button onclick="loadMessages()">
        🔄 Refresh Messages
      </button>
    </div>

    <div id="status" class="status"></div>

    <div id="messages" class="messages-grid">
      <div class="empty">
        Loading messages...
      </div>
    </div>

  </div>


  <script>

    const statusBox = document.getElementById("status");
    const messagesBox = document.getElementById("messages");


    function showStatus(message, type) {

      statusBox.style.display = "block";
      statusBox.className = "status " + type;
      statusBox.textContent = message;

    }


    function escapeHTML(value) {

      if (value === null || value === undefined) return "";

      return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    async function loadMessages() {

      messagesBox.innerHTML = `
        <div class="empty">
          Loading messages...
        </div>
      `;

      showStatus("Loading messages...", "loading");


      try {

        // cache: "no-store" forces the browser to always fetch fresh data
        // instead of reusing an old cached (304) response.
        const response = await fetch("/api/contact", {
          cache: "no-store",
          headers: {
            "Cache-Control": "no-cache"
          }
        });

        const data = await response.json();


        if (!response.ok || !data.success) {
          throw new Error(data.error || "Could not load messages");
        }


        const submissions = data.submissions || [];


        if (submissions.length === 0) {

          messagesBox.innerHTML = `
            <div class="empty">
              📭 No messages received yet.
            </div>
          `;

          showStatus("No messages found.", "success");

          return;

        }


        messagesBox.innerHTML = submissions
          .slice()
          .reverse()
          .map(item => {

            const date = item.submittedAt
              ? new Date(item.submittedAt).toLocaleString()
              : "Not available";


            return `
              <div class="message-card">

                <h2>
                  ${escapeHTML(item.name || "Unknown")}
                </h2>

                <div class="row">
                  <span class="label">Email</span>
                  <div class="value">
                    ${escapeHTML(item.email || "")}
                  </div>
                </div>

                <div class="row">
                  <span class="label">Phone</span>
                  <div class="value">
                    ${escapeHTML(item.phone || "")}
                  </div>
                </div>

                <div class="row">
                  <span class="label">Subject</span>
                  <div class="value">
                    ${escapeHTML(item.subject || "No subject")}
                  </div>
                </div>

                <div class="row">
                  <span class="label">Message</span>

                  <div class="message-box">
                    ${escapeHTML(item.message || "")}
                  </div>
                </div>

                <div class="row">
                  <span class="label">Received</span>
                  <div class="value">
                    ${escapeHTML(date)}
                  </div>
                </div>

              </div>
            `;

          })
          .join("");


        showStatus(
          `✓ ${submissions.length} message(s) loaded successfully.`,
          "success"
        );


      } catch (error) {

        console.error(error);


        messagesBox.innerHTML = `
          <div class="empty">
            ❌ Could not load messages.
          </div>
        `;


        showStatus(
          "Error: " + error.message,
          "error"
        );

      }

    }


    loadMessages();

  </script>

</body>
</html>
