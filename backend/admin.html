<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin | Contact Messages</title>

  <!-- Same favicon setup as the root portfolio -->
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=2">
  <link rel="icon" type="image/x-icon" href="assets/favicon.ico?v=2">
  <link rel="shortcut icon" href="assets/favicon.ico?v=2">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png?v=2">

  </head>

<body>
  <div class="admin-container">
    <div class="header">
      <div>
        <h1>Contact Messages</h1>
        <p>Messages submitted through your portfolio contact form.</p>
      </div>
      <button id="refreshMessages" type="button">Refresh Messages ↻</button>
    </div>

    <p id="loadingText">Loading messages...</p>
    <div id="messagesContainer"></div>
  </div>

  <script>
    const messagesContainer = document.getElementById("messagesContainer");
    const loadingText = document.getElementById("loadingText");
    const refreshMessages = document.getElementById("refreshMessages");

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    /*
      IMPORTANT:
      Supabase returns received_at as an ISO timestamp.
      We first use the timestamp exactly as received.
      If the browser can parse it, we show Pakistan time.
      If not, we show the original value instead of
      "Not available".
    */
    function formatPakistanTime(value) {
      if (value === null || value === undefined) return null;

      const raw = String(value).trim();
      if (!raw) return null;

      let date = new Date(raw);

      // PostgreSQL fallback: 2026-09-02 12:34:56+00
      if (Number.isNaN(date.getTime())) {
        const normalized = raw
          .replace(" ", "T")
          .replace(/([+-]\d{2})$/, "$1:00");

        date = new Date(normalized);
      }

      if (Number.isNaN(date.getTime())) {
        return raw;
      }

      return new Intl.DateTimeFormat("en-PK", {
        timeZone: "Asia/Karachi",
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: true
      }).format(date) + " PKT";
    }

    function getReceivedDate(message) {
      // received_at is the primary field.
      // submitted_at is fallback for older records.
      const value =
        message.received_at ??
        message.submitted_at ??
        message.receivedAt ??
        message.submittedAt;

      return formatPakistanTime(value) || "Not available";
    }

    function getSentDate(message) {
      const value =
        message.sent_at ??
        message.sentAt;

      return formatPakistanTime(value) || "Not available";
    }

    async function loadMessages() {
      loadingText.textContent = "Loading messages...";
      messagesContainer.innerHTML = "";
      refreshMessages.disabled = true;
      refreshMessages.textContent = "Loading...";

      try {
        const response = await fetch("/api/contact?admin_refresh=" + Date.now(), {
          method: "GET",
          cache: "no-store",
          headers: {
            "Accept": "application/json",
            "Cache-Control": "no-cache, no-store, must-revalidate",
            "Pragma": "no-cache"
          }
        });

        const responseText = await response.text();

        let result;
        try {
          result = JSON.parse(responseText);
        } catch {
          throw new Error("Contact API did not return JSON. Status: " + response.status);
        }

        if (!response.ok || !result.success) {
          throw new Error(result.error || "Could not load messages.");
        }

        const messages = Array.isArray(result.submissions)
          ? result.submissions
          : [];

        if (messages.length === 0) {
          loadingText.textContent = "";
          messagesContainer.innerHTML = `
            <div class="empty-message">No contact messages found yet.</div>
          `;
          return;
        }

        loadingText.textContent =
          `✓ ${messages.length} message(s) loaded successfully.`;

        messages.forEach((message) => {
          const card = document.createElement("div");
          card.className = "message-card";

          const sentDate = getSentDate(message);
          const receivedDate = getReceivedDate(message);

          card.innerHTML = `
            <h2>${escapeHtml(message.name || "Unknown")}</h2>

            <div class="info-row">
              <span class="label">Email</span>
              <div class="value">${escapeHtml(message.email || "Not provided")}</div>
            </div>

            <div class="info-row">
              <span class="label">Phone</span>
              <div class="value">${escapeHtml(message.phone || "Not provided")}</div>
            </div>

            <div class="info-row">
              <span class="label">Subject</span>
              <div class="value">${escapeHtml(message.subject || "No subject")}</div>
            </div>

            <div class="message-box">
              <span class="label">Message</span>
              <div class="value">${escapeHtml(message.message || "No message")}</div>
            </div>

            <small class="date">
              <strong>Sent:</strong> ${escapeHtml(sentDate)}<br>
              <strong>Received:</strong> ${escapeHtml(receivedDate)}
            </small>
          `;

          messagesContainer.appendChild(card);
        });

        console.log("Contact API response:", messages);

      } catch (error) {
        console.error("Load messages error:", error);
        loadingText.textContent = "";

        messagesContainer.innerHTML = `
          <div class="error-message">
            <strong>Could not load messages.</strong>
            <br><br>
            ${escapeHtml(error.message)}
          </div>
        `;
      } finally {
        refreshMessages.disabled = false;
        refreshMessages.textContent = "Refresh Messages ↻";
      }
    }

    refreshMessages.addEventListener("click", loadMessages);
    loadMessages();
  </script>
</body>
</html>
